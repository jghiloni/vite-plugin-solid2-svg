name: CI & Test

on:
  push: &ci-triggers
    branches:
      - main
    paths:
      - src/
      - .github/workflows/ci.yml
      - package.json
  pull_request: *ci-triggers

jobs:
  style-check:
    runs-on: ubuntu-latest
    name: Lint and Format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts
      - name: Run checks
        run: |
          pnpm compile
          pnpm check-style
  test:
    runs-on: ubuntu-latest
    name: Run checks
    needs: [style-check]
    strategy:
      matrix:
        runtime:
          - node@lts
          - node@latest
          - bun@latest
          - deno@2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: ${{matrix.runtime}}
      - name: Test
        run: pnpm test
  publish:
    if: ${{ github.event_name == "push" }}
    runs-on: ubuntu-latest
    name: Publish to Github Packages
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://npm.pkg.github.com
          package-manager-cache: true
      - name: Publish Package
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          pnpm build
          pnpm publish
